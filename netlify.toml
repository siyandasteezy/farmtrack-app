[build]
  # prisma generate must run after install so the functions have a client;
  # migrate deploy applies any new migrations before the new code goes live.
  # Both need DATABASE_URL / DIRECT_URL set in the Netlify environment.
  command       = "npx prisma generate && npx prisma migrate deploy && npm run build"
  publish       = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify treats every environment variable as a secret and fails the build
  # if it finds the value in the repo. These two are public by definition —
  # MAIL_FROM is the visible From header on every email, and APP_URL is the
  # site's own address, which appears in index.html, sitemap.xml and robots.txt.
  # The genuine secrets (DATABASE_URL, AUTH_SECRET, YOCO_SECRET_KEY,
  # RESEND_API_KEY) are deliberately NOT listed here and stay scanned.
  SECRETS_SCAN_OMIT_KEYS = "MAIL_FROM,APP_URL"

# Serverless backend (holds the Yoco secret key; creates/verifies checkouts)
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Let function calls through before the SPA catch-all
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Redirect all other routes to index.html so React Router handles navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Long-lived cache for hashed static assets (JS/CSS bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
