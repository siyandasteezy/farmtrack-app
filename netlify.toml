[build]
  # prisma generate must run after install so the functions have a client;
  # migrate deploy applies any new migrations before the new code goes live.
  # Both need DATABASE_URL / DIRECT_URL set in the Netlify environment.
  command       = "npx prisma generate && npx prisma migrate deploy && npm run build"
  publish       = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serverless backend (holds the Yoco secret key; creates/verifies checkouts)
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Let function calls through before the SPA catch-all
[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Redirect all other routes to index.html so React Router handles navigation
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Long-lived cache for hashed static assets (JS/CSS bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
